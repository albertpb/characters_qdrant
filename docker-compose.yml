services:
  qdrant:
    image: qdrant/qdrant:v1.13.2
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  api:
    build:
      context: ./backend
    environment:
      CHARDB_QDRANT_HOST: qdrant
      CHARDB_QDRANT_PORT: "6333"
    ports:
      - "8000:8000"
    depends_on:
      - qdrant

volumes:
  qdrant_data:
